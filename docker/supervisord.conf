[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/yesimbot-supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/run/yesimbot-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/yesimbot-supervisor.sock

[program:napcat]
directory=/app
command=/bin/bash /opt/yesimbot/docker/start-napcat.sh
environment=ACCOUNT="%(ENV_QQ_ACCOUNT)s"
autostart=%(ENV_NAPCAT_AUTOSTART)s
autorestart=false
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=20
; Upstream emits login QR/token material. Keep it out of container logs.
stdout_logfile=/dev/null
stderr_logfile=/dev/null

; agent-wechat (WeChat). Loopback only; the host's WeChat connector and the console use its owner token.
; init.mjs creates the private data directory and the token before this starts. The app image leaves it to the
; account's own WeChat container (entrypoint.sh).
[program:agent-wechat]
directory=%(ENV_KOISHI_STATE_DIR)s
command=/opt/agent-wechat/wx serve --listen 127.0.0.1:6174 --data-dir "%(ENV_KOISHI_STATE_DIR)s/data/agent-wechat" --token-file "%(ENV_KOISHI_STATE_DIR)s/data/agent-wechat/api-token"
environment=HOME="%(ENV_KOISHI_STATE_DIR)s/data/agent-wechat",TMPDIR="/tmp"
autostart=%(ENV_WECHAT_AUTOSTART)s
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
; Chat contents stay out of container logs; startup failures do not.
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The host (apps/server). Still named `koishi`: older production containers, the account manager and the deploy
; tools address it by that name.
[program:koishi]
directory=/var/lib/yesimbot
command=/bin/sh /opt/yesimbot/docker/start-host.sh
autostart=true
autorestart=false
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
